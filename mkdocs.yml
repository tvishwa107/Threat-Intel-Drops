site_name: intel drops
theme:
  name: material
  palette:
    scheme: slate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - md_in_html

plugins:
  - search
  - timetoread
  - caption:
      figure_caption_prefix: "Figure {index}: " 
